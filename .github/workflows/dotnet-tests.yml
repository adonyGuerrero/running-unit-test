name: Run .NET Unit Tests


on:
  push:
    branches:
      - dev
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore test/test.csproj

      - name: Build project
        run: dotnet build test/test.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test test/test.csproj --no-build --configuration Release